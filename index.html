<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyRadio</title>
    <script>
        (() => {
            const savedTheme = localStorage.getItem("theme") || "rose-gold";
            document.documentElement.setAttribute("data-theme", savedTheme);
        })();
    </script>
    <link rel="stylesheet" href="style.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📻</text></svg>">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HyRadio">
    <meta name="mobile-web-app-capable" content="yes">

    <meta name="theme-color" content="#1e1e2e">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <header class="gh-navbar">
        <!-- Izquierda: Marca, separador e info de estación -->
        <div class="gh-nav-left">
            <a href="/" class="gh-brand">
                <span class="gh-brand-name">Hy<strong>Radio</strong></span>
            </a>

            <div class="gh-divider"></div>

            <!-- Info de reproducción integrada -->
            <div class="gh-station-info">
                <div class="gh-info-pill station-pill">
                    <span class="gh-info-prefix">></span>
                    <span class="gh-info-label">SUENA:</span>
                    <span id="current-station" class="stream-text" title="Ninguna radio seleccionada">Ninguna radio
                        seleccionada</span>
                </div>
            </div>
        </div>

        <!-- Derecha: Estado ONLINE -->
        <div class="gh-nav-right">
            <div class="gh-status-badge state-stopped" id="stream-badge">
                <span class="gh-live-dot"></span>
                <span class="gh-status-label" id="stream-status-text">DETENIDO</span>
            </div>
        </div>
    </header>


    <div class="container">
        <div class="header-lista">
            <p>Selecciona una emisora de la lista:</p>

            <!-- Agrupamos los botones para que permanezcan juntos -->
            <div class="action-buttons">
                <input type="file" id="import-file" style="display: none;" accept=".json"
                    onchange="importStations(event)">
               <button class="io-btn-tooltip" data-tooltip="Guardar respaldo" onclick="exportStations()">[↑]</button>
                <button class="io-btn-tooltip" data-tooltip="Abrir respaldo" onclick="document.getElementById('import-file').click()">[↓]</button>
            </div>
        </div>

        <ul class="station-list" id="station-list"></ul>

        <div class="pomodoro-box" id="pomodoro">
            <div class="pomo-main">
                <span class="pomo-mode" id="pomo-mode">FOCUS</span>
                <span class="pomo-timer" id="pomo-time">20:00</span>
                <div class="pomo-controls">
                    <button id="pomo-toggle" title="Iniciar/Pausar">▶</button>
                    <button id="pomo-reset" title="Reiniciar">↺</button>
                </div>
            </div>

            <div class="pomo-presets">
                <button class="pomo-preset is-active" data-mins="20">[20m]</button>
                <button class="pomo-preset" data-mins="25">[25m]</button>
                <button class="pomo-preset" data-mins="30">[30m]</button>
                <button class="pomo-preset" data-mins="40">[40m]</button>
            </div>
        </div>

        <div class="console-box">
            <!-- Contenedor flex para alinear título y botón -->
            <div class="header-buscar">
                <p>Buscar radios del mundo</p>
                <button class="main-btn" onclick="buscarRadiosAlAzar()" title="Descubrir 25 radios al azar">[?]</button>
            </div>

            <input type="text" id="search-input" placeholder="Buscar por nombre o país...">
            <div id="search-results"></div>
        </div>
    </div>

    <footer class="bottom-bar">
        <div class="bottom-bar-content">

            <div class="theme-container" style="display: flex; align-items: center; gap: 10px;"> <button
                    class="main-btn2" onclick="prevTheme()" style="padding: 2px 8px;">&lt;</button>
                <select id="theme-select" class="theme-select" onchange="changeTheme()">
                    <optgroup label="Catppuccin">
                        <option value="mocha">Mocha</option>
                        <option value="latte">Latte (Claro)</option>
                    </optgroup>
                    <optgroup label="Monitores CRT">
                        <option value="retro-green">Fósforo Verde</option>
                        <option value="retro-amber">Fósforo Ámbar</option>
                        <option value="retro-cyan">Fósforo Cian</option>
                        <option value="retro-white">Fósforo P4</option>
                    </optgroup>
                    <optgroup label="Modernos">
                        <option value="dracula">Dracula</option>
                        <option value="nord">Nord</option>
                        <option value="monokai">Monokai</option>
                    </optgroup>
                    <optgroup label="Aesthetic">
                        <option value="ocean-breeze">Ocean Breeze</option>
                        <option value="miami-nights">Miami Night</option>
                        <option value="rose-gold">Rose Gold</option>
                        <option value="matcha">Matcha</option>
                        <option value="velvet">Velvet</option>
                    </optgroup>
                    <optgroup label="Vintage">
                        <option value="gruvbox-dark">Gruvbox Dark</option>
                        <option value="gruvbox-light">Gruvbox Light</option>
                        <option value="solarized-dark">Solarized Dark</option>
                        <option value="solarized-light">Solarized Light</option>
                    </optgroup>
                    <optgroup label="Neón">
                        <option value="cyberpunk">Cyberpunk 2077</option>
                        <option value="synthwave">Synthwave '84</option>
                    </optgroup>
                </select>
                <button class="main-btn2" onclick="nextTheme()" style="padding: 2px 8px;">&gt;</button>
            </div>
            <span class="separator">|</span>
            <div class="volume-container">
                <span>VOL</span>
                <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.5">
                <span class="vol-text" id="volume-text">[50%]</span>
            </div>
            <audio id="audio-player"></audio>
            <button id="play-btn" class="main-btn" onclick="playRadio()">[ Play ]</button>
            <button id="stop-btn" class="main-btn" onclick="stopRadio()">[ Stop ]</button>
        </div>
    </footer>
    <script src="script.js"></script>
</body>

</html>
